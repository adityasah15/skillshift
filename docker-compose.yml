services:
  postgres:
    image: postgres:16-alpine
    container_name: skillshift-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: skillshift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: skillshift-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data: