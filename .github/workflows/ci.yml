name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          # Prisma's postinstall downloads engine binaries from
          # binaries.prisma.sh; this keeps a flaky download from failing CI.
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            prisma-engines-${{ runner.os }}-

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3), retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Run integration tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t skillshift-api .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag skillshift-api "$DOCKERHUB_USERNAME/skillshift-api:latest"
          docker push "$DOCKERHUB_USERNAME/skillshift-api:latest"

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/skillshift
            docker compose pull api
            docker compose up -d api
            docker image prune -f
